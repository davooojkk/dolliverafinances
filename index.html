<!doctype html>
<html lang="es-uy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css">
    <title>dollivera - home</title>
  </head>

  <body>
    <header class="header">
      <nav aria-label="lista del header">
        <ul class="header-list">
          <li><p>dollivera</p> <span>finances</span></li>
          <li><a href="https://instagram.com/davotech.uy">instagram</a></li>
          <li>Gracias por utilizar!</li>
        </ul>
      </nav>
    </header>

    <main class="app-layout">
      <section class="dashboards">
      <aside id="gastos-moneda">
        <div>
          <h2>Gastos por moneda</h2>
          <form id="formulario-gastos-moneda">
            <select name="Monedas" id="monedas">
                <option value="brl">Reales Brasileros</option>
                <option value="uyu">Pesos Uruguayos</option>
                <option value="usd">Dolares Estadounidenses</option>
            </select>
          </form>
        </div>
        <div class="datos-gastos-moneda">
          <output id="total-moneda">0</output>
          <p id="moneda-seleccionada"></p>
        </div>
      </aside>
      <aside id="grafico-gastos">

        <canvas id="grafico-categorias"></canvas>
        <p>Todavía no hay gastos ingresados</p>
      </aside>
      <aside id="cotizacion-oficial"></aside>
    </section>
    <section class="gastos-list-block" aria-label="Lista completa de gastos">
      <div class="label-gastos-list">
        <p>Todos los gastos</p>
      </div>
      <div class="gastos-form-block">
        <form id="gastos-form">
            <label for="descripcion">
              Descripción del Gasto:
            </label>
          <input id="descripcion" type="text" placeholder="Ej: Compras Supermercado..." required>
            <label for="moneda">
              Moneda:
            </label>
          <select name="moneda" id="moneda">
            <option value="brl">Reales Brasileros</option>
            <option value="uyu">Pesos Uruguayos</option>
            <option value="usd">Dolares Estadounidenses</option>
          </select>
            <label for="monto">
              Monto: 
            </label>
          <input id="monto" type="number" min="0" step="0.01"  placeholder="Ej: 350..." required>
            <label for="categoria">
                Categoria:
            </label>
          <select name="categoria" id="categoria">
              <option value="gasto fijo">gasto fijo</option>
              <option value="insumos">insumos</option>
              <option value="consumo">consumo</option>
              <option value="salud-cuidado">salud-cuidado</option>
              <option value="fastfood">fastfood</option>
              <option value="hogar">hogar</option>
              <option value="transporte">transporte</option>
              <option value="mascota">mascota</option>
          </select>
            <label for="fecha">
              Fecha:
            </label>
          <input id="fecha" type="date" required>
          <button type="submit">Add</button>
          <p id="mensaje-error">Tu gasto no pudo ser ingresado! Verifica el monto ingresado.</p>
        </form>
      </div>
      <div class="gastos-list">
      </div>
    </section>
    </main>

    <form id="form-editar">
          <h2>Editar gasto</h2>
          <label for="descripcion">
              Descripción del Gasto:
            </label>
          <input id="descripcion" type="text" placeholder="Ej: Compras Supermercado..." required>
            <label for="moneda">
              Moneda:
            </label>
          <select name="moneda" id="moneda">
            <option value="brl">Reales Brasileros</option>
            <option value="uyu">Pesos Uruguayos</option>
            <option value="usd">Dolares Estadounidenses</option>
          </select>
            <label for="monto">
              Monto: 
            </label>
          <input id="monto" type="number" min="0" step="0.01"  placeholder="Ej: 350..." required>
            <label for="categoria">
                Categoria:
            </label>
          <select name="categoria" id="categoria">
              <option value="gasto fijo">gasto fijo</option>
              <option value="insumos">insumos</option>
              <option value="consumo">consumo</option>
              <option value="salud-cuidado">salud-cuidado</option>
              <option value="fastfood">fastfood</option>
              <option value="hogar">hogar</option>
              <option value="transporte">transporte</option>
              <option value="mascota">mascota</option>
          </select>
            <label for="fecha">
              Fecha:
            </label>
          <input id="fecha" type="date" required>
          <button type="submit">Guardar cambios</button>
          <p id="mensaje-error">No se pudieron guardar los cambios. Revisá el monto ingresado.</p>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
