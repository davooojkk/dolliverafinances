<!doctype html>
<html lang="es-uy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css">
    <title>dollivera - home</title>
  </head>

  <body>
    <header class="header">
      <nav aria-label="lista del header">
        <ul class="header-list">
          <li><p>dollivera</p> <span>finances</span></li>
          <li><a href="https://instagram.com/davotech.uy">instagram</a></li>
          <li>Gracias por utilizar!</li>
        </ul>
      </nav>
    </header>
    <section class="gastos-list-block" aria-label="Lista completa de gastos">
      <div class="label-gastos-list">
        <p>Todos los gastos</p>
      </div>
      <div class="gastos-form-block">
        <form id="gastos-form">
            <label for="descripcion">
              Descripción del Gasto:
            </label>
          <input id="descripcion" type="text" placeholder="Ej: Compras Supermercado..." required>
            <label for="moneda">
              Moneda:
            </label>
          <select name="moneda" id="moneda">
            <option value="brl">Reales Brasileros</option>
            <option value="uyu">Pesos Uruguayos</option>
            <option value="usd">Dolares Estadounidenses</option>
          </select>
            <label for="monto">
              Monto:
            </label>
          <input id="monto" type="number" min="0" step="0.01"  placeholder="Ej: 350..." required>
            <label for="categoria">
                Categoria:
            </label>
          <select name="categoria" id="categoria">
              <option value="gasto fijo">gasto fijo</option>
              <option value="insumos">insumos</option>
              <option value="consumo">consumo</option>
              <option value="salud-cuidado">salud-cuidado</option>
              <option value="fastfood">fastfood</option>
              <option value="hogar">hogar</option>
              <option value="transporte">transporte</option>
              <option value="mascota">mascota</option>
          </select>
            <label for="fecha">
              Fecha:
            </label>
          <input id="fecha" type="date" required>
          <button type="submit">Add</button>
          <p id="mensaje-error">Tu gasto no pudo ser ingresado! Verifica el monto ingresado.</p>
        </form>
      </div>
      <div class="gastos-list">
      </div>
    </section>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
